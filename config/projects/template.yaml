project:
  name: "Template Project"
  description: "Base template for all projects"
  
features:
  jira_ticketing:
    enabled: true
    project_key: "TEMPLATE"
    issue_type: "Bug"
    priority: "Medium"
    
  self_heal:
    enabled: true
    max_attempts: 3
    allow_auto_merge: false
    
  chatbot:
    enabled: true
    knowledge_base: true

integrations:
  jira:
    url: "https://jira.example.com"
    
  bitbucket:
    url: "https://bitbucket.org"
    workspace: "template-workspace"
    
ai_settings:
  model: "claude-3-sonnet-20240229"
  temperature: 0.7
  max_tokens: 2000
